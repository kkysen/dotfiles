name: Lint

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash -n (syntax check)
        run: git ls-files -z '*.sh' | xargs -0 -n1 bash -n

      - name: shellcheck
        run: git ls-files -z '*.sh' | xargs -0 shellcheck
